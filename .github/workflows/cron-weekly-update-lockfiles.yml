name: Update Lockfiles
on:
  schedule:
    - cron: "5 0 * * 0"
  workflow_dispatch:
permissions: {}
jobs:
  update-nightly:
    name: Update nightly rustc
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rbmt
      - name: Update lockfiles
        run: |
          cargo rbmt lock --lockfiles minimal,maximum
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          author: Update Lockfiles Bot <bot@example.com>
          committer: Update Lockfiles Bot <bot@example.com>
          title: Automated weekly update to lockfiles
          body: |
            Automated update to lockfiles
          commit-message: Automated update to lockfiles
          branch: create-pull-request/weekly-lockfiles-update
