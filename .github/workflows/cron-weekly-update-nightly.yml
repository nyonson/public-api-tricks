name: Update Nightly Toolchain
on:
  schedule:
    - cron: "5 0 * * 6" # Saturday at 00:05
  workflow_dispatch: # allows manual triggering
permissions: {}
jobs:
  update-nightly:
    name: Update nightly rustc
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rbmt
      - name: Update nightly toolchain in Cargo.toml
        run: |
          cargo rbmt toolchains --update-nightly
          echo "nightly_version=$(cargo rbmt toolchains --nightly)" >> $GITHUB_ENV
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          author: Update Nightly Bot <bot@example.com>
          committer: Update Nightly Bot <bot@example.com>
          title: Automated weekly update to nightly (to ${{ env.nightly_version }})
          body: |
            Automated update to Cargo.toml
          commit-message: Automated update to nightly ${{ env.nightly_version }}
          branch: create-pull-request/weekly-nightly-update
